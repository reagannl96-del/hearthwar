<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#5a3a1c"/>
      <stop offset="0.55" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1c1108"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="45%">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5d1c"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2418"/>
      <stop offset="1" stop-color="#4a120c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e98a3"/>
      <stop offset="0.5" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#7c8691"/>
    </linearGradient>
    <linearGradient id="flameOut" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e2461c"/>
      <stop offset="0.6" stop-color="#ff8a24"/>
      <stop offset="1" stop-color="#ffc24a"/>
    </linearGradient>
    <linearGradient id="flameIn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#fff2b8"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M256 118 L356 150 L356 262 C356 330 312 380 256 404 C200 380 156 330 156 262 L156 150 Z"/>
    </clipPath>
  </defs>

  <!-- backdrop (Discord crops to the circle) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#d9a441" stroke-opacity="0.35" stroke-width="6"/>
  <circle cx="256" cy="286" r="190" fill="url(#glow)"/>

  <!-- crossed swords behind the shield -->
  <g stroke-linecap="round">
    <g transform="rotate(-38 256 262)">
      <rect x="248" y="66" width="16" height="330" rx="3" fill="url(#steel)"/>
      <path d="M248 66 L256 38 L264 66 Z" fill="#eef2f5"/>
      <rect x="218" y="392" width="76" height="16" rx="6" fill="url(#brass)"/>
      <rect x="249" y="408" width="14" height="40" rx="4" fill="#4a2e14"/>
      <circle cx="256" cy="456" r="12" fill="url(#brass)"/>
    </g>
    <g transform="rotate(38 256 262)">
      <rect x="248" y="66" width="16" height="330" rx="3" fill="url(#steel)"/>
      <path d="M248 66 L256 38 L264 66 Z" fill="#eef2f5"/>
      <rect x="218" y="392" width="76" height="16" rx="6" fill="url(#brass)"/>
      <rect x="249" y="408" width="14" height="40" rx="4" fill="#4a2e14"/>
      <circle cx="256" cy="456" r="12" fill="url(#brass)"/>
    </g>
  </g>

  <!-- the shield -->
  <path d="M256 104 L370 140 L370 262 C370 340 320 396 256 422 C192 396 142 340 142 262 L142 140 Z" fill="url(#brass)"/>
  <path d="M256 118 L356 150 L356 262 C356 330 312 380 256 404 C200 380 156 330 156 262 L156 150 Z" fill="url(#shield)"/>

  <!-- the hearth inside it: a stone arch and the fire -->
  <g clip-path="url(#shieldClip)">
    <path d="M186 372 L186 262 C186 220 218 192 256 192 C294 192 326 220 326 262 L326 372 Z" fill="#2a1a10"/>
    <!-- arch stones -->
    <g fill="#b9ab94" stroke="#5c5043" stroke-width="3">
      <path d="M176 372 L176 262 C176 214 212 182 256 182 L256 200 C222 200 196 226 196 262 L196 372 Z"/>
      <path d="M336 372 L336 262 C336 214 300 182 256 182 L256 200 C290 200 316 226 316 262 L316 372 Z"/>
      <rect x="244" y="174" width="24" height="30" rx="3"/>
    </g>
    <!-- hearthstone -->
    <rect x="160" y="352" width="192" height="30" fill="#8c7f6c" stroke="#5c5043" stroke-width="3"/>
    <!-- logs -->
    <rect x="206" y="330" width="100" height="18" rx="9" fill="#6a4020" transform="rotate(-10 256 339)"/>
    <rect x="206" y="330" width="100" height="18" rx="9" fill="#7c4c26" transform="rotate(10 256 339)"/>
    <!-- the fire -->
    <path d="M256 204 C280 240 304 262 300 298 C298 324 280 342 256 342 C232 342 212 324 212 298 C212 276 224 262 234 246 C236 262 244 272 252 274 C246 248 246 226 256 204 Z" fill="url(#flameOut)"/>
    <path d="M258 244 C272 266 284 282 280 304 C278 322 268 334 256 334 C242 334 232 322 232 306 C232 290 242 280 248 270 C250 282 256 288 262 288 C258 272 254 258 258 244 Z" fill="url(#flameIn)"/>
  </g>

  <!-- brass studs on the rim -->
  <g fill="#fff2c4">
    <circle cx="256" cy="112" r="6"/>
    <circle cx="150" cy="146" r="6"/>
    <circle cx="362" cy="146" r="6"/>
  </g>
</svg>
